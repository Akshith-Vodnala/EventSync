<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventSync - Registered Attendees</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Include Header -->
    <div th:replace="~{fragments/headers :: navbar}"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="font-weight-bold text-dark">👥 Booking Requests & Registrations</h2>
                <p class="text-muted mb-0">Event: <span class="font-weight-bold text-primary" th:text="${event.title}">Event Title</span></p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary font-weight-bold">Back to Dashboard</a>
        </div>

        <!-- Attendees Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="thead-dark">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reg : ${registrations}">
                                <td class="font-weight-bold text-dark" th:text="${reg.userName}">Attendee Name</td>
                                <td th:text="${reg.userEmail}">Attendee Email</td>
                                <td>
                                    <!-- Booking Status Badges -->
                                    <span th:if="${reg.status == 'PENDING'}" class="badge badge-pill badge-warning py-2 px-3">PENDING APPROVAL</span>
                                    <span th:if="${reg.status == 'ACCEPTED'}" class="badge badge-pill badge-success py-2 px-3">ACCEPTED</span>
                                    <span th:if="${reg.status == 'REJECTED'}" class="badge badge-pill badge-danger py-2 px-3">REJECTED</span>
                                </td>
                                <td class="text-center">
                                    <!-- Accept Button (Visible only for Pending requests) -->
                                    <a th:if="${reg.status == 'PENDING'}" 
                                       th:href="@{/admin/api/accept-booking(eventId=${event.id}, userId=${reg.userId})}" 
                                       class="btn btn-sm btn-success font-weight-bold px-3 mr-2">
                                        <i class="fa-solid fa-check mr-1"></i> Accept
                                    </a>
                                    
                                    <!-- Reject Button (Visible for Pending or Accepted requests) -->
                                    <a th:if="${reg.status != 'REJECTED'}" 
                                       th:href="@{/admin/api/reject-booking(eventId=${event.id}, userId=${reg.userId})}" 
                                       class="btn btn-sm btn-danger font-weight-bold px-3"
                                       onclick="return confirm('Are you sure you want to reject/cancel this booking?');">
                                        <i class="fa-solid fa-xmark mr-1"></i> Reject
                                    </a>
                                    
                                    <!-- Disabled State if already rejected -->
                                    <span th:if="${reg.status == 'REJECTED'}" class="text-muted small font-italic">No actions available</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(registrations)}">
                                <td colspan="4" class="text-center py-4 text-muted">No booking requests received for this event yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
