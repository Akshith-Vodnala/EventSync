<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventSync - Edit Event</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Include Header -->
    <div th:replace="~{fragments/headers :: navbar}"></div>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white font-weight-bold">
                        ✏️ Edit Event Details
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/api/update-event/{id}(id=${event.id})}" th:object="${event}" method="post">
                            
                            <div class="form-group">
                                <label for="title">Event Title:</label>
                                <input type="text" id="title" th:field="*{title}" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="description">Event Description:</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="date">Event Date:</label>
                                    <input type="date" id="date" th:field="*{date}" class="form-control" required>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label for="time">Event Time:</label>
                                    <input type="time" id="time" th:field="*{time}" class="form-control" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="venue">Event Venue:</label>
                                <input type="text" id="venue" th:field="*{venue}" class="form-control" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="price">Ticket Price ($):</label>
                                    <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label for="capacity">Maximum Seat Capacity:</label>
                                    <input type="number" id="capacity" th:field="*{capacity}" class="form-control" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="category">Package Category:</label>
                                <select id="category" th:field="*{category}" class="form-control" required>
                                    <option value="WEDDING">💍 Wedding & Marriage Packages</option>
                                    <option value="BIRTHDAY">🎂 Birthday Party Packages</option>
                                    <option value="CONFERENCE">🤝 Corporate Meetings & Seminars</option>
                                    <option value="PARTY">🎉 Social Gatherings & Concerts</option>
                                    <option value="OTHER">⭐ Other Services</option>
                                </select>
                            </div>

                            <!-- Hidden field to preserve available seats and registration list -->
                            <input type="hidden" th:field="*{availableSeats}">
                            <input type="hidden" th:field="*{registrations}">

                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-info font-weight-bold">Update Event</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
