<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventSync - Connect</title>
    <!-- Bootstrap and Google Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        h1, h2, h3, h4, .navbar-brand {
            font-family: 'Outfit', sans-serif;
        }
        .contact-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            background: white;
            overflow: hidden;
        }
        .contact-info-panel {
            background: linear-gradient(135deg, #1e3a8a, #0d9488);
            color: white;
            padding: 50px;
        }
        .contact-form-panel {
            padding: 50px;
        }
        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            margin-right: 15px;
            transition: all 0.3s ease;
            text-decoration: none !important;
        }
        .social-icon:hover {
            background: white;
            color: #1e3a8a;
            transform: translateY(-2px);
        }
        .form-control-custom {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }
        .form-control-custom:focus {
            border-color: #0d9488;
            box-shadow: none;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Include Header -->
    <div th:replace="~{fragments/headers :: navbar}"></div>

    <div class="container my-5">
        <div class="card contact-card">
            <div class="row no-gutters">
                <!-- Left Panel: Info -->
                <div class="col-md-5 contact-info-panel d-flex flex-column justify-content-between">
                    <div>
                        <h2 class="font-weight-bold mb-3">Get in touch</h2>
                        <p class="opacity-90 mb-5">Have a question about EventSync? Or want to discuss your next Full Stack project? Drop a message!</p>
                        
                        <div class="mb-4">
                            <p class="mb-2"><i class="fa-solid fa-envelope mr-3 text-teal"></i> gangushivayamini10@gmail.com</p>
                            <p class="mb-2"><i class="fa-solid fa-phone mr-3 text-teal"></i> +91 7995534701</p>
                            <p class="mb-0"><i class="fa-solid fa-location-dot mr-3 text-teal"></i> Warangal, Telangana, India</p>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <a href="https://github.com/yaminigangu" target="_blank" class="social-icon"><i class="fa-brands fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/yaminigangu" target="_blank" class="social-icon"><i class="fa-brands fa-linkedin"></i></a>
                    </div>
                </div>
                
                <!-- Right Panel: Form -->
                <div class="col-md-7 contact-form-panel">
                    <h3 class="font-weight-bold text-dark mb-4">Send a Message</h3>
                    
                    <form action="#" method="get" onsubmit="alert('Message Sent successfully! (Mock Action)'); return false;">
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary small">First Name</label>
                                <input type="text" class="form-control form-control-custom" placeholder="John" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary small">Last Name</label>
                                <input type="text" class="form-control form-control-custom" placeholder="Doe" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="font-weight-bold text-secondary small">Email Address</label>
                            <input type="email" class="form-control form-control-custom" placeholder="john.doe@example.com" required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold text-secondary small">Subject</label>
                            <input type="text" class="form-control form-control-custom" placeholder="Collaboration / Feedback" required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold text-secondary small">Message</label>
                            <textarea class="form-control form-control-custom" rows="4" placeholder="Write your message here..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark font-weight-bold px-4 py-2 mt-3" style="border-radius: 30px;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
