# Server Port
server.port=8082

# MongoDB Connection Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/eventsync_db

# Thymeleaf Cache (disable for real-time development reloading)
spring.thymeleaf.cache=false

# Disable session ID appending in URLs (Prevents URL rewriting like ;jsessionid=...)
server.servlet.session.tracking-modes=cookie
